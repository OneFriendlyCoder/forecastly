server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080/;
    }

    location /agent/explain/ {
        proxy_pass http://agent:8090/explain/;
        proxy_read_timeout 330s;  # longer than the agent's 5-minute limit
        proxy_buffering off;  # otherwise progress steps all arrive at the end
    }
}
