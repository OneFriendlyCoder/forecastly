name: pipeline-pulse

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 3s
      timeout: 10s
      retries: 20

  create-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Keyed by deal_id, so 6 partitions allows up to 6 parallel consumers.
    command:
      - >-
        for topic in activity.events activity.events.dlq deal.features; do
        rpk topic list -X brokers=redpanda:9092 | grep -q "^$$topic " ||
        rpk topic create "$$topic" -p 6 -r 1 -X brokers=redpanda:9092 || exit 1;
        done
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse  # local demo only
      POSTGRES_DB: pipeline_pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pipeline_pulse"]
      interval: 3s
      timeout: 5s
      retries: 20

  deal-state:
    build:
      context: ..
      dockerfile: services/deal-state/Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pipeline_pulse
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully
    restart: unless-stopped

  scoring:
    build: ../ml/scoring
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pipeline_pulse
      MODEL_PATH: /models/deal_model.txt
    volumes:
      - ../data/models:/models:ro  # built by make train
    depends_on:
      deal-state:
        condition: service_started
    restart: unless-stopped  # also covers starting before deal-state has made the tables

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pipeline_pulse
    ports:
      - "127.0.0.1:8080:8080"  # no login yet, so only this machine can reach it
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redpanda-data:
  postgres-data:
